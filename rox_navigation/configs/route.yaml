# Route configuration for neo_route node
neo_route_node:
  ros__parameters:

    # Set the initial pose manually in RViz before starting route following.

    # List of node IDs to navigate through. No motion starts until ~/start is called.
    # Runtime changes to node_ids are used by the next start request.
    # ~/resume continues the saved sequence and progress from the last start.
    node_ids: [6, 0, 3, 7, 11, 12, 6]
