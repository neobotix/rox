linear_axis_control/controller_manager:
  ros__parameters:
    defaults:
      allow_controller_activation_with_inactive_hardware: false

    update_rate: 50 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    linear_axis_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hardware_components_initial_state:
      inactive:
        - "linear_axis_control"

linear_axis_controller:
  ros__parameters:
    joints:
      - linear_axis_slide_joint

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0 # Defaults to 50
    action_monitor_rate: 20.0 # Defaults to 20
    allow_integration_in_goal_trajectories: true

    allow_partial_joints_goal: false # Defaults to false
    constraints:
      stopped_velocity_tolerance: 0.006 # Defaults to 0.01
      linear_axis_slide_joint: {goal: 0.006 }

    gains:
      linear_axis_slide_joint:
        p: 0.3
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
