controller_manager:
  ros__parameters:

    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # ---- Arm 1 controllers (prefix: arm1_) ----
    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    # ---- Arm 2 controllers (prefix: arm2_) ----
    arm2_io_and_status_controller:
      type: ur_controllers/GPIOController

    arm2_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    arm2_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    arm2_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm2_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    arm2_forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    arm2_forward_position_controller:
      type: position_controllers/JointGroupPositionController

    # ---- Linear axis controller ----
    linear_axis_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ============================================================
# Arm 1 controller parameters (prefix: arm1_)
# ============================================================

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "arm1_"

io_and_status_controller:
  ros__parameters:
    tf_prefix: "arm1_"

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: arm1_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: arm1_tool0
    topic_name: arm1_ft_data

joint_trajectory_controller:
  ros__parameters:
    joints:
      - arm1_shoulder_pan_joint
      - arm1_shoulder_lift_joint
      - arm1_elbow_joint
      - arm1_wrist_1_joint
      - arm1_wrist_2_joint
      - arm1_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      arm1_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - arm1_shoulder_pan_joint
      - arm1_shoulder_lift_joint
      - arm1_elbow_joint
      - arm1_wrist_1_joint
      - arm1_wrist_2_joint
      - arm1_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      arm1_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      arm1_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    speed_scaling_interface_name: arm1_speed_scaling/speed_scaling_factor

forward_velocity_controller:
  ros__parameters:
    joints:
      - arm1_shoulder_pan_joint
      - arm1_shoulder_lift_joint
      - arm1_elbow_joint
      - arm1_wrist_1_joint
      - arm1_wrist_2_joint
      - arm1_wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - arm1_shoulder_pan_joint
      - arm1_shoulder_lift_joint
      - arm1_elbow_joint
      - arm1_wrist_1_joint
      - arm1_wrist_2_joint
      - arm1_wrist_3_joint

