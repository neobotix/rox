controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm1_io_and_status_controller:
      type: ur_controllers/GPIOController
    arm1_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster
    arm1_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    arm1_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm1_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    arm1_forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    arm1_forward_position_controller:
      type: position_controllers/JointGroupPositionController
    arm2_io_and_status_controller:
      type: ur_controllers/GPIOController
    arm2_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster
    arm2_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    arm2_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm2_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    arm2_forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    arm2_forward_position_controller:
      type: position_controllers/JointGroupPositionController
    linear_axis_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    linear_axis_gpio_controller:
      type: gpio_controllers/GpioCommandController
    hardware_components_initial_state:
      inactive:
        - "linear_axis_control"
    defaults:
      allow_controller_activation_with_inactive_hardware: false
    enforce_command_limits: false

arm1_io_and_status_controller:
  ros__parameters:
    tf_prefix: "$(var arm1_prefix)"

arm1_speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "$(var arm1_prefix)"

arm1_force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: $(var arm1_prefix)tcp_fts_sensor
    state_interface_names: [force.x, force.y, force.z, torque.x, torque.y, torque.z]
    frame_id: $(var arm1_prefix)tool0_controller
    topic_name: arm1_ft_data

arm1_joint_trajectory_controller:
  ros__parameters:
    joints:
      - $(var arm1_prefix)shoulder_pan_joint
      - $(var arm1_prefix)shoulder_lift_joint
      - $(var arm1_prefix)elbow_joint
      - $(var arm1_prefix)wrist_1_joint
      - $(var arm1_prefix)wrist_2_joint
      - $(var arm1_prefix)wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      $(var arm1_prefix)shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)elbow_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)wrist_3_joint: {trajectory: 0.2, goal: 0.1}

arm1_scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - $(var arm1_prefix)shoulder_pan_joint
      - $(var arm1_prefix)shoulder_lift_joint
      - $(var arm1_prefix)elbow_joint
      - $(var arm1_prefix)wrist_1_joint
      - $(var arm1_prefix)wrist_2_joint
      - $(var arm1_prefix)wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    speed_scaling_interface_name: $(var arm1_prefix)speed_scaling/speed_scaling_factor
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      $(var arm1_prefix)shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)elbow_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm1_prefix)wrist_3_joint: {trajectory: 0.2, goal: 0.1}

arm1_forward_velocity_controller:
  ros__parameters:
    joints:
      - $(var arm1_prefix)shoulder_pan_joint
      - $(var arm1_prefix)shoulder_lift_joint
      - $(var arm1_prefix)elbow_joint
      - $(var arm1_prefix)wrist_1_joint
      - $(var arm1_prefix)wrist_2_joint
      - $(var arm1_prefix)wrist_3_joint
    interface_name: velocity

arm1_forward_position_controller:
  ros__parameters:
    joints:
      - $(var arm1_prefix)shoulder_pan_joint
      - $(var arm1_prefix)shoulder_lift_joint
      - $(var arm1_prefix)elbow_joint
      - $(var arm1_prefix)wrist_1_joint
      - $(var arm1_prefix)wrist_2_joint
      - $(var arm1_prefix)wrist_3_joint

arm2_io_and_status_controller:
  ros__parameters:
    tf_prefix: "$(var arm2_prefix)"

arm2_speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "$(var arm2_prefix)"

arm2_force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: $(var arm2_prefix)tcp_fts_sensor
