      - $(var arm2_prefix)elbow_joint
      - $(var arm2_prefix)wrist_1_joint
      - $(var arm2_prefix)wrist_2_joint
      - $(var arm2_prefix)wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      $(var arm2_prefix)shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)elbow_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)wrist_3_joint: {trajectory: 0.2, goal: 0.1}

arm2_scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - $(var arm2_prefix)shoulder_pan_joint
      - $(var arm2_prefix)shoulder_lift_joint
      - $(var arm2_prefix)elbow_joint
      - $(var arm2_prefix)wrist_1_joint
      - $(var arm2_prefix)wrist_2_joint
      - $(var arm2_prefix)wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    speed_scaling_interface_name: $(var arm2_prefix)speed_scaling/speed_scaling_factor
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      $(var arm2_prefix)shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)elbow_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      $(var arm2_prefix)wrist_3_joint: {trajectory: 0.2, goal: 0.1}

arm2_forward_velocity_controller:
  ros__parameters:
    joints:
      - $(var arm2_prefix)shoulder_pan_joint
      - $(var arm2_prefix)shoulder_lift_joint
      - $(var arm2_prefix)elbow_joint
      - $(var arm2_prefix)wrist_1_joint
      - $(var arm2_prefix)wrist_2_joint
      - $(var arm2_prefix)wrist_3_joint
    interface_name: velocity

arm2_forward_position_controller:
  ros__parameters:
    joints:
      - $(var arm2_prefix)shoulder_pan_joint
      - $(var arm2_prefix)shoulder_lift_joint
      - $(var arm2_prefix)elbow_joint
      - $(var arm2_prefix)wrist_1_joint
      - $(var arm2_prefix)wrist_2_joint
      - $(var arm2_prefix)wrist_3_joint

linear_axis_controller:
  ros__parameters:
    joints: [linear_axis_slide_joint]
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.006
      linear_axis_slide_joint: {goal: 0.006}
    gains:
      linear_axis_slide_joint: {p: 0.02, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}

linear_axis_gpio_controller:
  ros__parameters:
    gpios: [linear_axis_gpio]
    state_interfaces:
      - position_min
      - position_max
      - velocity_min
      - velocity_max
      - acceleration
      - deceleration
      - quick_stop_deceleration
      - invert_velocity_polarity
      - state
    command_interfaces:
      - position_min
      - position_max
      - velocity_min
      - velocity_max
      - acceleration
      - deceleration
      - quick_stop_deceleration
      - invert_velocity_polarity
      - init_cmd
      - enable_cmd
